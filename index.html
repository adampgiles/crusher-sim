<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydraulic Press Sim</title>
<style>
:root{--bg:#15171b;--fg:#ece9e2;--pn:#23272e;--ac:#f2a900;--mut:#8b919b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--fg:#ece9e2;--pn:#23272e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pn)}
#hud b{letter-spacing:.08em;font-size:12px;color:var(--ac);white-space:nowrap}
#fb{flex:1;height:8px;background:#0006;border-radius:4px;overflow:hidden}
#fb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ab36b,#f2a900,#e0443a)}
#fv{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
#sub{padding:2px 12px 4px;color:var(--mut);font-size:12px;min-height:20px;background:var(--pn)}
canvas{flex:1;min-height:0;width:100%;object-fit:contain;background:#1a1d22}
#chips{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:var(--pn);scrollbar-width:none}
#chips button{flex:none;background:#0004;color:var(--fg);border:1px solid #fff2;border-radius:18px;padding:7px 12px;font-size:13px}
#chips button:active{background:var(--ac);color:#000}
#ctl{display:flex;gap:8px;padding:8px 10px 10px;background:var(--pn)}
#ctl button{flex:1;padding:16px 4px;border:0;border-radius:10px;font-weight:700;font-size:15px;background:#343a44;color:var(--fg);touch-action:none}
#ctl button.pri{flex:1.6;background:var(--ac);color:#111}
#ctl button.on{filter:brightness(1.25);transform:scale(.97)}
#ctl #rs,#ctl #mu{flex:.7;font-size:13px}
#dp{padding:8px 10px;background:var(--pn);display:flex;flex-direction:column;gap:6px}
#dp[hidden]{display:none}
#dm{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#dm button{flex:none;background:#0004;color:var(--fg);border:1px solid #fff2;border-radius:18px;padding:7px 12px;font-size:13px}
#dm button.sel{background:var(--ac);color:#000}
#da{display:flex;gap:6px}
#da button{flex:1;padding:13px 2px;border:0;border-radius:10px;background:#343a44;color:var(--fg);font-weight:600;font-size:13px}
#da .pri{background:var(--ac);color:#111;flex:1.4}
#hds{display:flex;gap:6px;padding:6px 10px 0;overflow-x:auto;background:var(--pn);scrollbar-width:none;align-items:center}
#hds:before{content:'Head';color:var(--mut);font-size:12px;margin-right:2px}
#hds button{flex:none;background:#0004;color:var(--fg);border:1px solid #fff2;border-radius:14px;padding:6px 11px;font-size:12px}
#hds button.sel{background:var(--ac);color:#000}
/* ===== professional layout: portrait stack, landscape side panel ===== */
:root{--bg:#0e1014;--pn:#171a20;--pn2:#212630;--bd:#2b313b;--fg:#e9ebef;--mut:#8a919c;--ac:#f2a900;--acf:#171000;--ok:#4ab36b;--bad:#e0443a;color-scheme:dark light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e5e8ee;--pn:#ffffff;--pn2:#eef1f6;--bd:#d0d6df;--fg:#161a21;--mut:#586270}}
html,body{height:100%}
button{font-family:inherit}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto auto auto;grid-template-areas:"hud" "cv" "sub" "hds" "chips" "dp" "ctl";background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow:hidden;overscroll-behavior:none}
#hud{grid-area:hud;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
#hud b{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--ac);white-space:nowrap}
#fb{flex:1;height:10px;border-radius:5px;background:var(--pn2);border:1px solid var(--bd);overflow:hidden}
#fb i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--ok),var(--ac) 60%,var(--bad))}
#fv{min-width:112px;text-align:right;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--fg)}
#sub{grid-area:sub;padding:8px 14px;background:var(--pn);color:var(--mut);font-size:12px;min-height:34px;border-top:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{grid-area:cv;display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;background:#0b0d10}
#hds,#chips{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pn);border-top:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
#hds{grid-area:hds}#chips{grid-area:chips}
.gl{flex:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);padding:0 2px 0 8px}
#hds::-webkit-scrollbar,#chips::-webkit-scrollbar,#dm::-webkit-scrollbar{display:none}
#hds::before,#chips::before{content:attr(data-l);flex:none;margin:0 4px 0 0;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#chips button,#hds button,#dm button{flex:none;border:1px solid var(--bd);background:var(--pn2);color:var(--fg);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .08s,background .15s}
#chips button:active,#hds button:active,#dm button:active{transform:scale(.95);background:var(--ac);color:var(--acf)}
#hds button.sel,#dm button.sel{background:var(--ac);color:var(--acf);border-color:var(--ac)}
#dp{grid-area:dp;display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--pn);border-top:1px solid var(--bd)}
#dp[hidden]{display:none}
#dm{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none}
#da{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#da button{padding:13px 4px;border:1px solid var(--bd);border-radius:12px;background:var(--pn2);color:var(--fg);font-weight:600;font-size:13px}
#da .pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
#ctl{grid-area:ctl;display:flex;gap:10px;padding:12px 14px;background:var(--pn);border-top:1px solid var(--bd)}
#ctl button{flex:1;min-height:56px;border:1px solid var(--bd);border-radius:14px;background:var(--pn2);color:var(--fg);font-size:14px;font-weight:700;letter-spacing:.04em;touch-action:none;-webkit-user-select:none;user-select:none}
#ctl button.pri{flex:1.8;background:linear-gradient(#f7b92a,#e29a00);color:var(--acf);border-color:#c98900;box-shadow:0 3px 0 #9a6a00}
#ctl button.on{transform:translateY(2px);box-shadow:none;filter:brightness(1.12)}
#ctl #rs,#ctl #mu{flex:.55;font-size:13px}
#hud{flex-wrap:wrap}#fb{min-width:70px}
#ss{margin-left:auto;border:1px solid var(--bd);background:var(--pn2);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;cursor:pointer}
#ss.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
#lf,#rt{display:none}
body.ss #lf,body.ss #rt{display:block;flex:.6}
body.ss .nm{display:none!important}
body:not(.ss) .sp{display:none!important}
@media (min-aspect-ratio:1/1){
 body{grid-template-columns:minmax(290px,370px) minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;grid-template-areas:"hud cv" "sub cv" "hds cv" "chips cv" "dp cv" "ctl cv"}
 #sub{white-space:normal;border-top:0}
 #hds{flex-wrap:wrap;overflow-x:hidden}
 #chips{flex-wrap:wrap;align-content:flex-start;overflow-x:hidden;overflow-y:auto}
 #hds::before,#chips::before{flex-basis:100%;margin:0}
 #ctl{display:grid;grid-template-columns:1fr 1fr}
 #ctl #dn{grid-column:1/-1;order:-1;min-height:64px}
 #ctl #rs,#ctl #mu{flex:none}
 canvas{border-left:1px solid var(--bd)}
 .gl{flex-basis:100%;padding:8px 0 0}
}
@media (max-height:440px){
 #hud{padding:6px 12px}#sub{padding:5px 12px;min-height:26px}
 #hds,#chips{padding:7px 12px}#ctl{padding:8px 12px;gap:8px}#ctl button{min-height:42px}#ctl #dn{min-height:48px}
 #chips button,#hds button{padding:7px 11px;font-size:12px}
}
</style></head><body>
<div id="hud"><b>HYDRAULIC PRESS</b><button id="ss">SUPERSIZE</button><div id="fb"><i></i></div><span id="fv">0 kN</span></div>
<div id="sub">Drag objects to move them, then hold PRESS.</div>
<canvas id="c" width="360" height="520"></canvas>
<div id="dp" hidden><div id="dm"></div><div id="da"><button id="dh">Hollow: off</button><button id="dcl">Clear</button><button id="dx">Cancel</button><button id="dd" class="pri">Drop it</button></div></div>
<div id="chips" data-l="Objects"></div>
<div id="hds" data-l="Press head"></div>
<div id="ctl"><button id="up">▲ RAISE</button><button id="dn" class="pri">▼ PRESS</button><button id="lf">◀</button><button id="rt">▶</button><button id="rs">RESET</button><button id="mu">🔊</button></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=360,H=520,FY=440,XL=40,XR=320,RMIN=80,G=2000;
const WW=1800,Z=.62,WB_PY=26,WB_L=372;let SS=0,hx=180,hdx=0,dirW=1,BL=40,BR=320,WB=null,mvL=0,mvR=0,camx=0,camy=-285;
const sp=document.createElement('canvas');sp.width=W;sp.height=H;const sx=sp.getContext('2d');
let P=[],S=[],B=[],D=[],ram=RMIN+30,F=0,shake=0,down=0,up=0,acc=0,lastT=0,muted=false;

// material properties: k stiffness, ten = tensile break strain, yl = yield strain, fl = plastic flow, jc juice, du dust, gl glass
const M={
 rubber:{k:.3,ten:1.8,yl:9,fl:0},
 rind:{k:.5,ten:.16,yl:.1,fl:.04,jc:1},
 flesh:{k:.3,ten:.45,yl:.07,fl:.08,jc:1},
 shell:{k:.7,ten:.03,cmp:.06,yl:9,fl:0,gl:.4,sm:1},
 goo:{k:.28,ten:.9,yl:.05,fl:.12,jc:1},
 glass:{k:.85,ten:.03,cmp:.05,yl:9,fl:0,gl:1,sm:1},
 metal:{k:.55,ten:.4,cmp:.5,yl:.06,fl:.3,sm:.85,ys:.08},
 stone:{k:.92,ten:.025,cmp:.045,yl:9,fl:0,du:1,sm:1},
 steel:{k:.95,ten:3,yl:9,fl:.02,sm:1,ys:.6},
 skin:{k:.4,ten:.3,yl:.08,fl:.06,jc:1},
 wood:{k:.8,ten:.05,cmp:.07,yl:9,fl:0,du:1,sm:1},
 jelly:{k:.3,ten:.5,yl:.1,fl:.05,jc:1},
 iron:{k:.9,ten:.03,cmp:.05,yl:9,fl:0,sm:1},
 ceramic:{k:.88,ten:.035,cmp:.055,yl:9,fl:0,gl:.6,sm:1},
 paper:{k:.7,ten:.06,cmp:.1,yl:9,fl:0,du:1,sm:1},
 candy:{k:.5,ten:.08,cmp:.12,yl:9,fl:0,gl:.5,sm:1},
 coin:{k:.95,ten:3,yl:9,fl:0,sm:1},
 tnt:{k:.5,ten:.12,yl:.05,fl:.05,du:1},
 wball:{k:.95,ten:9,cmp:9,yl:9,fl:0,sm:1,hv:1}
};
const RHO={rubber:1.1,rind:.9,flesh:.95,shell:2.4,goo:1.03,glass:2.5,metal:2.7,stone:2.0,steel:7.8,skin:1,wood:.7,jelly:1.05,iron:7.2,ceramic:2.4,paper:.8,candy:1.4,coin:9,tnt:1.6,wball:80},MU={rubber:.9,glass:.2,steel:.3,stone:.6,metal:.4,rind:.5,flesh:.6,goo:.2,skin:.5,shell:.3};
const RR={rubber:.48,rind:.46,flesh:.48,goo:.49,skin:.47,steel:.46};
for(const k in M){M[k].rho=RHO[k];M[k].mu=MU[k]||.4;M[k].rr=RR[k]||.42;M[k].cmp=M[k].cmp||9}
const el=(a,b)=>(x,y)=>(x/a)**2+(y/b)**2<=1;
const rr=(x,y,a,b)=>Math.sqrt((x/a)**2+(y/b)**2);
const O={
 ball:{n:'Rubber ball',e:'🏀',s:7,hb:42,f:el(42,42),c:(x,y)=>{const r=rr(x,y,42,42);return[r>.9?8:14,80,r>.9?26:48,'rubber']}},
 melon:{n:'Watermelon',e:'🍉',s:8,hb:48,f:el(60,48),c:(x,y)=>{const r=rr(x,y,60,48),a=Math.atan2(y,x);
   if(r>.88)return[Math.sin(a*9)>0?125:110,50,Math.sin(a*9)>0?30:22,'rind'];
   if(r>.8)return[75,30,85,'rind'];
   return Math.random()<.04?[0,0,8,'flesh']:[355,78,52,'flesh']}},
 egg:{n:'Egg',e:'🥚',s:4.5,hb:28,f:el(21,28),c:(x,y)=>{const r=rr(x,y,21,28);
   if(r>.8)return[40,35,90,'shell'];
   if(r<.42)return[44,95,52,'goo'];
   return[50,40,93,'goo']}},
 bottle:{n:'Glass bottle',e:'🍾',s:4.5,hb:58,hol:2.2,liq:'#7cc4ff',f:(x,y)=>(Math.abs(x)<21&&y>=-14&&y<=58)||(y<-14&&y>=-30&&Math.abs(x)<8+(y+30)/16*13)||(Math.abs(x)<8&&y>=-62&&y<-30),
   c:()=>[135,45,34,'glass']},
 can:{n:'Soda can',e:'🥫',s:4.5,hb:36,hol:2.2,liq:'#5a2d14',f:(x,y)=>Math.abs(x)<22&&Math.abs(y)<36,
   c:(x,y)=>Math.abs(y)>31?[210,8,72,'metal']:[0,75,Math.abs(y)<8?85:44,'metal']},
 brick:{n:'Brick',e:'🧱',s:6,hb:20,f:(x,y)=>Math.abs(x)<42&&Math.abs(y)<20,c:()=>[11,55,36,'stone']},
 bulb:{n:'Light bulb',e:'💡',s:4,hb:38,hol:2.2,f:(x,y)=>(x*x+(y+20)**2<=27*27&&y<12)||(Math.abs(x)<9&&y>=0&&y<=38),
   c:(x,y)=>y>12?[40,8,55,'glass']:[50,25,88,'glass']},
 tomato:{n:'Tomato',e:'🍅',s:5.5,hb:24,f:el(27,24),c:(x,y)=>{const r=rr(x,y,27,24);
   if(y<-17&&Math.abs(x)<9)return[110,60,32,'skin'];
   return r>.85?[4,80,42,'skin']:[4,75,50,'flesh']}},
 steel:{n:'Steel ball',e:'⚫',s:6,hb:30,f:el(30,30),c:(x,y)=>[215,8,Math.random()<.5?52:46,'steel']}
};
const INFO={ball:'0.4 kg, elastic, rebounds',melon:'~5 kg, rind bursts at roughly 0.3 kN',egg:'60 g, shell cracks at roughly 40 N',bottle:'0.4 kg, glass fails at several kN',can:'full can buckles at roughly 1 kN, pressurised',brick:'2.5 kg, crushes at roughly 60 kN',bulb:'30 g, thin brittle glass',tomato:'150 g, skin splits at roughly 20 N',steel:'7.8x water density, yields far above this press'};
const chips=document.getElementById('chips');
// ---- new objects, grouped into sections ----
const rc=(a,b)=>(x,y)=>Math.abs(x)<a&&Math.abs(y)<b;
const sweets=(n,R,rad,sx=1,sy=.9)=>{const a=[];for(let i=0;i<n;i++){const t=i*2.4+1,d=Math.sqrt((i+.5)/n)*R;a.push([Math.cos(t)*d*sx,Math.sin(t)*d*sy,rad,i+1,(i*53)%360])}return a};
const fillOf=(sw,mat,sat,li,hue)=>(x,y)=>{for(const w of sw)if(Math.hypot(x-w[0],y-w[1])<w[2])return[hue==null?w[4]:hue,sat,li,mat,w[3]];return null};
Object.assign(O,{
 orange:{n:'Orange',e:'🍊',s:7,hb:26,f:el(26,26),c:(x,y)=>rr(x,y,26,26)>.85?[28,95,50,'skin']:[32,95,55,'flesh']},
 apple:{n:'Apple',e:'🍎',s:7,hb:23,f:el(25,23),c:(x,y)=>rr(x,y,25,23)>.88?[2,75,42,'skin']:[50,60,88,'flesh']},
 pumpkin:{n:'Pumpkin',e:'🎃',s:9,hb:40,f:el(50,40),c:(x,y)=>rr(x,y,50,40)>.88?[26,90,48,'rind']:Math.random()<.03?[48,40,80,'flesh']:[30,90,55,'flesh']},
 jelly:{n:'Jelly',e:'🍮',s:7,hb:20,f:rc(24,20),c:()=>[300,60,60,'jelly']},
 mug:{n:'Mug',e:'☕',s:5,hb:20,hol:2,f:(x,y)=>(Math.abs(x)<18&&Math.abs(y)<20)||(x>=14&&Math.hypot(x-20,y)<14&&Math.hypot(x-20,y)>6),c:()=>[200,15,92,'ceramic']},
 plate:{n:'Plate',e:'🍽️',s:4,hb:5,f:rc(36,5),c:()=>[210,10,95,'ceramic']},
 phone:{n:'Phone',e:'📱',s:5,hb:4,f:rc(32,4),c:(x,y)=>y<0?[220,30,12,'glass']:[210,8,60,'metal']},
 crate:{n:'Wooden crate',e:'📦',s:6,hb:28,hol:2.2,f:rc(32,28),c:(x,y)=>[28,50,Math.abs(Math.round(y/9))%2?38:32,'wood']},
 concrete:{n:'Concrete block',e:'🧱',s:6,hb:20,hol:2.2,f:rc(36,20),c:()=>[0,0,55,'stone']},
 log:{n:'Log',e:'🪵',s:5,hb:13,f:rc(44,13),c:()=>[25,45,30,'wood']},
 ice:{n:'Ice block',e:'🧊',s:5,hb:22,f:rc(22,22),c:()=>[195,60,80,'glass']},
 anvil:{n:'Anvil',e:'⚒️',s:5,hb:22,f:(x,y)=>(y>=-22&&y<-6&&Math.abs(x)<38)||(y>=-6&&y<12&&Math.abs(x)<14)||(y>=12&&y<=22&&Math.abs(x)<26),c:()=>[220,10,28,'steel']},
 dumbbell:{n:'Dumbbell',e:'🏋️',s:5,hb:16,f:(x,y)=>Math.hypot(Math.abs(x)-34,y)<16||(Math.abs(x)<34&&Math.abs(y)<5),c:()=>[215,8,34,'steel']},
 cbomb:{n:'Candy bomb',e:'🍬',s:5,hb:40,hol:2,f:el(40,40),c:()=>[300,50,28,'iron'],fill:fillOf(sweets(7,24,7.5),'candy',85,58)},
 pinata:{n:'Piñata',e:'🪅',s:5,hb:38,hol:1.8,f:el(48,38),c:(x)=>[(Math.round(x/10)*40+330)%360,80,60,'paper'],fill:fillOf(sweets(9,30,7.5,1.1),'candy',85,58)},
 piggy:{n:'Piggy bank',e:'🐷',s:5,hb:34,hol:1.8,f:el(46,34),c:()=>[345,60,80,'ceramic'],fill:fillOf(sweets(8,26,6.5,1.1),'coin',90,52,45)},
 chest:{n:'Treasure chest',e:'💰',s:5,hb:30,hol:2,f:rc(40,30),c:(x,y)=>[28,60,Math.abs(y)>24||Math.abs(x)>34?30:36,'wood'],fill:fillOf(sweets(10,30,6.5,1.2,.8),'coin',90,52,45)},
 jar:{n:'Marble jar',e:'🫙',s:4.5,hb:34,hol:1.8,f:rc(26,34),c:()=>[190,30,80,'glass'],fill:fillOf(sweets(6,18,8,1,1.3),'glass',70,55)},
 bomb:{n:'Bomb',e:'💣',s:5,hb:34,boom:1,hol:2,f:el(34,34),c:()=>[220,8,20,'iron'],fill:()=>[18,85,50,'tnt',1]},
 dynamite:{n:'Dynamite',e:'🧨',s:5,hb:24,boom:1,f:(x,y)=>Math.abs(y)<24&&(Math.abs(x+16)<7||Math.abs(x)<7||Math.abs(x-16)<7),c:(x)=>[4,80,45,'tnt',x<-9?1:x<9?2:3]}
});
// ---- redesigned silhouettes: every object stands upright and is recognisable ----
const rrf=(a,b,r)=>(x,y)=>{const u=Math.max(Math.abs(x)-(a-r),0),v=Math.max(Math.abs(y)-(b-r),0);return u*u+v*v<=r*r};
const ang=(x,y)=>Math.atan2(y,x);
Object.assign(O,{
